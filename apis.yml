description: 'Regulatory DataCorp (RDC) was a risk and compliance intelligence company whose flagship
  GRID (Global Regulatory Information Database) powered KYC, AML, and third-party/financial-crime
  screening. RDC was acquired by Moody''s Corporation in 2020 and fully absorbed into Moody''s
  risk and KYC product line; it no longer operates as a standalone entity. The former rdc.com and
  regulatorydatacorp.com domains are parked on Moody''s nameservers with no live site, developer
  portal, or public API. Surfaced as a portfolio-company lead of bain-capital-ventures; no independent
  API surface exists to enrich.'
